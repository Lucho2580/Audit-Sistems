<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>Atlas · mapa</title>
<style>
:root{--fondo:#ffffff;--panel:#f6f7f9;--borde:#d9dde3;--texto:#1d2330;--suave:#5d6675;--acento:#2f6fde;--alerta:#c62f3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){--fondo:#14171c;--panel:#1c2027;--borde:#2e343e;--texto:#e6e9ef;--suave:#9aa3b2;--acento:#6ea0ff;--alerta:#ff7a84;color-scheme:dark}}
:root[data-tema="oscuro"]{--fondo:#14171c;--panel:#1c2027;--borde:#2e343e;--texto:#e6e9ef;--suave:#9aa3b2;--acento:#6ea0ff;--alerta:#ff7a84;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--borde);background:var(--panel)}
header h1{font-size:15px;margin:0 6px 0 0}
.grupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:inherit;background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:3px 10px;cursor:pointer}
button[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
label{display:inline-flex;gap:4px;align-items:center;cursor:pointer;user-select:none}
.muestra{display:inline-block;width:10px;height:3px;border-radius:2px}
.buscador{position:relative;flex:1 1 220px;max-width:360px}
.buscador input{width:100%;font:inherit;color:inherit;background:var(--fondo);border:1px solid var(--borde);border-radius:6px;padding:4px 10px}
#resultados{position:absolute;z-index:5;left:0;right:0;top:100%;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--borde);border-radius:6px;max-height:320px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#resultados li{padding:4px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#resultados li:hover,#resultados li.activo{background:var(--fondo)}
main{display:grid;grid-template-columns:1fr minmax(280px,380px);flex:1;min-height:0}
#zona{position:relative;min-height:300px;overflow:hidden}
canvas{display:block;touch-action:none;cursor:grab}
#estadisticas{position:absolute;left:10px;bottom:8px;color:var(--suave);font-size:12px}
#panel{border-left:1px solid var(--borde);background:var(--panel);padding:12px 16px;overflow:auto}
#panel h2{font-size:16px;margin:4px 0 8px;word-break:break-word}
#panel h3{font-size:13px;margin:14px 0 4px;color:var(--suave);text-transform:uppercase;letter-spacing:.03em}
#panel ul{margin:0;padding-left:18px}
#panel li{margin:2px 0;word-break:break-word}
#panel a{color:var(--acento);text-decoration:none}
#panel a:hover{text-decoration:underline}
code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--fondo);border:1px solid var(--borde);border-radius:4px;padding:0 4px}
.tipo,.n{color:var(--suave);font-size:12px}
.alerta{color:var(--alerta);font-weight:600}
.capas{border-left:3px solid var(--alerta);padding-left:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--fondo);border:1px solid var(--borde);border-radius:999px;padding:1px 4px 1px 10px}
.chip button{border:0;padding:0 6px;background:transparent}
[hidden]{display:none!important}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:60vh auto;height:auto}#panel{border-left:0;border-top:1px solid var(--borde)}}
</style>
</head>
<body>
<header>
  <h1>Atlas</h1>
  <div class="grupo" role="group" aria-label="Vista">
    <button type="button" data-vista="modulos" aria-pressed="true">Módulos</button>
    <button type="button" data-vista="archivos" aria-pressed="false">Archivos</button>
    <span id="foco" class="chip" hidden>foco: <b id="foco-nombre"></b><button type="button" id="foco-quitar" aria-label="Quitar foco">×</button></span>
  </div>
  <div class="buscador">
    <input id="buscar" type="search" placeholder="Buscar módulo, archivo, ruta o modelo  ( / )" autocomplete="off" aria-label="Buscar">
    <ul id="resultados" role="listbox" hidden></ul>
  </div>
  <div class="grupo" role="group" aria-label="Aristas">
    <label><input type="checkbox" data-filtro="import"><span class="muestra" style="background:#7f8c9d"></span>imports</label>
    <label><input type="checkbox" data-filtro="http"><span class="muestra" style="background:#f28e2b"></span>http</label>
    <label><input type="checkbox" data-filtro="db"><span class="muestra" style="background:#59a14f"></span>datos</label>
    <label><input type="checkbox" data-filtro="prueba"><span class="muestra" style="background:#b07aa1"></span>pruebas</label>
    <label><input type="checkbox" data-filtro="docs"><span class="muestra" style="background:#3f9fd8"></span>docs</label>
  </div>
  <div class="grupo" id="capas" role="group" aria-label="Capas" hidden>
    <label><input type="checkbox" data-capa="seguridad">seguridad</label>
    <label><input type="checkbox" data-capa="hotspots">hotspots</label>
    <label><input type="checkbox" data-capa="huecosPruebas">sin pruebas</label>
    <label><input type="checkbox" data-capa="riesgo">riesgo</label>
  </div>
  <div class="grupo">
    <button type="button" id="btn-encuadrar" title="Encuadrar">⤢</button>
    <button type="button" id="btn-tema" title="Cambiar tema claro/oscuro">◐</button>
  </div>
</header>
<main>
  <div id="zona"><canvas id="lienzo" tabindex="0" aria-label="Grafo del proyecto"></canvas><div id="estadisticas"></div></div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<script>
/*
 * Código del visor que corre en el navegador. Es un script (no un módulo): se compila con el
 * resto del proyecto para tener chequeo de tipos y se incrusta en docs/atlas/visor.html.
 * Sin dependencias ni red. Todo dentro de una IIFE para no chocar con globales del DOM.
 */
(function () {
    const D = JSON.parse(document.getElementById('datos').textContent || '{}');
    const $ = (id) => document.getElementById(id);
    // ------------------------------------------------------------------ índices
    const modulos = new Map(D.modulos.map((m) => [m.id, m]));
    const archivos = new Map(D.archivos.map((a) => [a.id, a]));
    const rutas = new Map(D.rutas.map((r) => [r.id, r]));
    const modelos = new Map(D.modelos.map((m) => [m.id, m]));
    const docs = new Map(D.docs.map((d) => [d.id, d]));
    const salientes = new Map();
    const entrantes = new Map();
    for (const e of D.aristas) {
        if (!salientes.has(e.de))
            salientes.set(e.de, []);
        salientes.get(e.de).push(e);
        if (!entrantes.has(e.a))
            entrantes.set(e.a, []);
        entrantes.get(e.a).push(e);
    }
    const moduloDe = (id) => archivos.get(id)?.modulo ?? rutas.get(id)?.modulo ?? modelos.get(id)?.modulo ?? (modulos.has(id) ? id : undefined);
    const PALETA = ['#4e79a7', '#f28e2b', '#59a14f', '#e15759', '#76b7b2', '#edc948', '#b07aa1', '#ff9da7', '#9c755f', '#3f9fd8', '#c0a000', '#8cd17d'];
    const colorModulo = new Map();
    D.modulos.forEach((m, i) => colorModulo.set(m.id, m.comun ? '#8a8f98' : PALETA[i % PALETA.length]));
    const COLOR_ARISTA = { import: '#7f8c9d', http: '#f28e2b', db: '#59a14f', prueba: '#b07aa1', docs: '#3f9fd8', declara: '#7f8c9d' };
    // ------------------------------------------------------------------ estado
    const estado = {
        vista: 'modulos',
        filtros: { import: true, http: true, db: true, prueba: false, docs: false },
        capas: { seguridad: false, hotspots: false, huecosPruebas: false, riesgo: false },
        foco: null,
        seleccion: null,
        hover: null,
    };
    // ------------------------------------------------------------------ tema
    const raizHtml = document.documentElement;
    const temaGuardado = (() => {
        try {
            return localStorage.getItem('atlas-tema');
        }
        catch {
            return null;
        }
    })();
    if (temaGuardado === 'claro' || temaGuardado === 'oscuro')
        raizHtml.dataset.tema = temaGuardado;
    $('btn-tema').addEventListener('click', () => {
        const oscuroAhora = raizHtml.dataset.tema ? raizHtml.dataset.tema === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        raizHtml.dataset.tema = oscuroAhora ? 'claro' : 'oscuro';
        try {
            localStorage.setItem('atlas-tema', raizHtml.dataset.tema);
        }
        catch {
            /* sin almacenamiento */
        }
        dibujar();
    });
    const css = (v) => getComputedStyle(raizHtml).getPropertyValue(v).trim();
    // ------------------------------------------------------------------ construcción del grafo visible
    let nodos = [];
    let enlaces = [];
    let porIdNodo = new Map();
    let alfa = 1;
    function posInicial(i, n) {
        // Espiral áurea: determinista y bien repartida.
        const ang = i * 2.399963;
        const rad = 30 * Math.sqrt(i + 1) * (n > 200 ? 1.6 : 1);
        return [Math.cos(ang) * rad, Math.sin(ang) * rad];
    }
    function construirVista() {
        const previos = porIdNodo;
        nodos = [];
        enlaces = [];
        porIdNodo = new Map();
        const agregar = (n) => {
            const p = previos.get(n.id);
            const [x, y] = p ? [p.x, p.y] : posInicial(nodos.length, 100);
            const nodo = { ...n, x, y, vx: 0, vy: 0 };
            nodos.push(nodo);
            porIdNodo.set(n.id, nodo);
            return nodo;
        };
        if (estado.vista === 'modulos') {
            for (const m of D.modulos)
                agregar({ id: m.id, tipo: 'modulo', etiqueta: m.slug, r: 8 + Math.sqrt(m.archivos) * 3, color: colorModulo.get(m.id) });
            const pesos = new Map();
            for (const e of D.aristas) {
                if (!estado.filtros[e.t] || e.t === 'docs')
                    continue;
                const ma = moduloDe(e.de);
                const mb = moduloDe(e.a);
                if (!ma || !mb || ma === mb)
                    continue;
                const k = ma + '>' + mb + '>' + e.t;
                const prev = pesos.get(k);
                if (prev)
                    prev.peso++;
                else
                    pesos.set(k, { s: porIdNodo.get(ma), t: porIdNodo.get(mb), tipo: e.t, peso: 1 });
            }
            enlaces = [...pesos.values()];
        }
        else {
            const visibles = new Set();
            const enFoco = (id) => !estado.foco || moduloDe(id) === estado.foco;
            for (const a of D.archivos)
                if (enFoco(a.id))
                    visibles.add(a.id);
            if (estado.foco) {
                // Vecinos directos del módulo en foco, para ver con quién habla.
                for (const e of D.aristas) {
                    if (!estado.filtros[e.t])
                        continue;
                    if (visibles.has(e.de) && archivos.has(e.a))
                        visibles.add(e.a);
                    if (visibles.has(e.a) && archivos.has(e.de))
                        visibles.add(e.de);
                }
            }
            const lista = D.archivos.filter((a) => visibles.has(a.id));
            for (const a of lista) {
                agregar({ id: a.id, tipo: 'archivo', etiqueta: a.ruta.slice(a.ruta.lastIndexOf('/') + 1), r: 3 + Math.min(9, Math.sqrt(a.lineas) / 2.5), color: colorModulo.get(a.modulo) ?? '#888' });
            }
            const asegurar = (id) => {
                if (porIdNodo.has(id))
                    return porIdNodo.get(id);
                const r = rutas.get(id);
                if (r) {
                    const n = agregar({ id, tipo: 'ruta', etiqueta: r.metodo + ' ' + r.plantilla, r: 5, color: COLOR_ARISTA.http });
                    const f = porIdNodo.get(r.archivo);
                    if (f)
                        enlaces.push({ s: n, t: f, tipo: 'declara', peso: 1 });
                    return n;
                }
                const m = modelos.get(id);
                if (m)
                    return agregar({ id, tipo: 'modelo', etiqueta: m.nombre, r: 6, color: COLOR_ARISTA.db });
                const d = docs.get(id);
                if (d)
                    return agregar({ id, tipo: 'doc', etiqueta: d.ruta.slice(d.ruta.lastIndexOf('/') + 1), r: 5, color: COLOR_ARISTA.docs });
                const mod = modulos.get(id);
                if (mod)
                    return agregar({ id, tipo: 'modulo', etiqueta: mod.slug, r: 9, color: colorModulo.get(id) });
                return undefined;
            };
            for (const e of D.aristas) {
                if (!estado.filtros[e.t])
                    continue;
                const deVisible = visibles.has(e.de) || (e.t === 'docs' && visibles.has(e.a)) || (e.t === 'docs' && modulos.has(e.a) && enFoco(e.a));
                if (!deVisible && !visibles.has(e.a))
                    continue;
                if (e.t === 'import' && !(visibles.has(e.de) && visibles.has(e.a)))
                    continue;
                const s = asegurar(e.de);
                const t = asegurar(e.a);
                if (s && t)
                    enlaces.push({ s, t, tipo: e.t, peso: 1 });
            }
        }
        alfa = 1;
        actualizarEstadisticas();
    }
    function quadtree() {
        if (!nodos.length)
            return null;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const n of nodos) {
            if (n.x < minX)
                minX = n.x;
            if (n.y < minY)
                minY = n.y;
            if (n.x > maxX)
                maxX = n.x;
            if (n.y > maxY)
                maxY = n.y;
        }
        const tam = Math.max(maxX - minX, maxY - minY) + 1;
        const raiz = { x0: minX, y0: minY, tam, masa: 0, cx: 0, cy: 0 };
        const insertar = (c, n, prof) => {
            c.cx = (c.cx * c.masa + n.x) / (c.masa + 1);
            c.cy = (c.cy * c.masa + n.y) / (c.masa + 1);
            c.masa++;
            if (!c.hijos && !c.nodo) {
                c.nodo = n;
                return;
            }
            if (prof > 30)
                return;
            if (!c.hijos) {
                const m = c.tam / 2;
                c.hijos = [0, 1, 2, 3].map((i) => ({ x0: c.x0 + (i % 2) * m, y0: c.y0 + Math.floor(i / 2) * m, tam: m, masa: 0, cx: 0, cy: 0 }));
                const viejo = c.nodo;
                c.nodo = undefined;
                insertar(hijo(c, viejo), viejo, prof + 1);
            }
            insertar(hijo(c, n), n, prof + 1);
        };
        const hijo = (c, n) => {
            const m = c.tam / 2;
            return c.hijos[(n.x >= c.x0 + m ? 1 : 0) + (n.y >= c.y0 + m ? 2 : 0)];
        };
        for (const n of nodos)
            insertar(raiz, n, 0);
        return raiz;
    }
    function paso() {
        const k = estado.vista === 'modulos' ? 2600 : 900;
        const arbol = quadtree();
        const repeler = (n, c) => {
            if (!c.masa || c.nodo === n)
                return;
            const dx = n.x - c.cx;
            const dy = n.y - c.cy;
            const d2 = dx * dx + dy * dy + 0.01;
            if (c.hijos && (c.tam * c.tam) / d2 > 0.64) {
                for (const h of c.hijos)
                    repeler(n, h);
                return;
            }
            const f = (k * c.masa * alfa) / d2;
            n.vx += dx * f * 0.05;
            n.vy += dy * f * 0.05;
        };
        if (arbol)
            for (const n of nodos)
                repeler(n, arbol);
        const largo = estado.vista === 'modulos' ? 140 : 45;
        for (const e of enlaces) {
            const dx = e.t.x - e.s.x;
            const dy = e.t.y - e.s.y;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;
            const fuerza = ((d - largo - e.s.r - e.t.r) / d) * 0.04 * alfa * Math.min(3, 1 + Math.log(e.peso));
            e.s.vx += dx * fuerza;
            e.s.vy += dy * fuerza;
            e.t.vx -= dx * fuerza;
            e.t.vy -= dy * fuerza;
        }
        for (const n of nodos) {
            n.vx -= n.x * 0.004 * alfa;
            n.vy -= n.y * 0.004 * alfa;
            if (n.fijo) {
                n.vx = n.vy = 0;
                continue;
            }
            n.vx *= 0.6;
            n.vy *= 0.6;
            n.x += Math.max(-30, Math.min(30, n.vx));
            n.y += Math.max(-30, Math.min(30, n.vy));
        }
        alfa *= 0.985;
    }
    // ------------------------------------------------------------------ dibujo
    const lienzo = $('lienzo');
    const ctx = lienzo.getContext('2d');
    const vista = { escala: 1, tx: 0, ty: 0 };
    let ancho = 0;
    let alto = 0;
    function redimensionar() {
        const r = lienzo.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        ancho = r.width;
        alto = r.height;
        lienzo.width = Math.round(ancho * dpr);
        lienzo.height = Math.round(alto * dpr);
        lienzo.style.width = ancho + 'px';
        lienzo.style.height = alto + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dibujar();
    }
    const aPantalla = (x, y) => [x * vista.escala + vista.tx + ancho / 2, y * vista.escala + vista.ty + alto / 2];
    const aMundo = (px, py) => [(px - ancho / 2 - vista.tx) / vista.escala, (py - alto / 2 - vista.ty) / vista.escala];
    function vecinos(id) {
        const s = new Set([id]);
        for (const e of enlaces) {
            if (e.s.id === id)
                s.add(e.t.id);
            if (e.t.id === id)
                s.add(e.s.id);
        }
        return s;
    }
    function dibujar() {
        ctx.clearRect(0, 0, ancho, alto);
        const texto = css('--texto');
        const fondo = css('--fondo');
        const activo = estado.hover?.id ?? estado.seleccion;
        const resaltados = activo && porIdNodo.has(activo) ? vecinos(activo) : null;
        ctx.save();

    $('btn-encuadrar').addEventListener('click', encuadrar);
    // Búsqueda
    const entrada = $('buscar');
    const resultados = $('resultados');
    const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const indiceBusqueda = [
        ...D.modulos.map((m) => ({ id: m.id, texto: norm(m.slug + ' ' + m.nombre), tipo: 'módulo', etiqueta: m.slug })),
        ...D.archivos.map((a) => ({ id: a.id, texto: norm(a.ruta + ' ' + a.exp.join(' ')), tipo: 'archivo', etiqueta: a.ruta })),
        ...D.rutas.map((r) => ({ id: r.id, texto: norm(r.metodo + ' ' + r.plantilla), tipo: 'ruta', etiqueta: r.metodo + ' ' + r.plantilla })),
        ...D.modelos.map((m) => ({ id: m.id, texto: norm(m.nombre + ' ' + m.campos.join(' ')), tipo: 'modelo', etiqueta: m.nombre })),
    ];
    let activoResultado = -1;
    function buscar() {
        const q = norm(entrada.value.trim());
        activoResultado = -1;
        if (!q) {
            resultados.hidden = true;
            return;
        }
        const terminos = q.split(/\s+/);
        const encontrados = indiceBusqueda
            .filter((x) => terminos.every((t) => x.texto.includes(t)))
            .sort((a, b) => Number(!norm(a.etiqueta).startsWith(terminos[0])) - Number(!norm(b.etiqueta).startsWith(terminos[0])) || a.etiqueta.length - b.etiqueta.length)
            .slice(0, 12);
        resultados.innerHTML = encontrados.length
            ? encontrados.map((x, i) => '<li role="option" data-i="' + i + '" data-id="' + esc(x.id) + '"><span class="n">' + x.tipo + '</span> ' + esc(x.etiqueta) + '</li>').join('')
            : '<li class="n">Sin resultados</li>';
        resultados.hidden = false;
    }
    entrada.addEventListener('input', buscar);
    entrada.addEventListener('keydown', (ev) => {
        const items = [...resultados.querySelectorAll('li[data-id]')];
        if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
            ev.preventDefault();
            activoResultado = (activoResultado + (ev.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length);
            items.forEach((li, i) => li.classList.toggle('activo', i === activoResultado));
        }
        else if (ev.key === 'Enter') {
            const li = items[Math.max(0, activoResultado)];
            if (li)
                elegir(li.dataset.id);
        }
        else if (ev.key === 'Escape') {
            resultados.hidden = true;
        }
    });
    resultados.addEventListener('mousedown', (ev) => {
        const li = ev.target.closest('li[data-id]');
        if (li)
            elegir(li.dataset.id);
    });
    function elegir(id) {
        resultados.hidden = true;
        entrada.value = '';
        seleccionar(id, true);
    }
    document.addEventListener('keydown', (ev) => {
        if (ev.key === '/' && document.activeElement !== entrada) {
            ev.preventDefault();
            entrada.focus();
        }
    });
    function actualizarEstadisticas() {
        $('estadisticas').textContent = nodos.length + ' nodos · ' + enlaces.length + ' aristas';
    }
    // ------------------------------------------------------------------ inicio
    window.addEventListener('resize', redimensionar);
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', dibujar);
    construirVista();
    for (let i = 0; i < 300; i++)
        paso();
    redimensionar();
    encuadrar();
    sincronizarControles();
    mostrarPanel();
    leerHash();
    animar();
})();
</script>
</body>
</html>
